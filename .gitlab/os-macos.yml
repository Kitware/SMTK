# macOS-specific builder configurations and build commands

## Base configurations

.macos:
    image: "registry.hub.docker.com/kitware/macos-ci-images:macos-26-xcode-16.4-20260707"
    variables:
        GIT_CLONE_PATH: "$CI_BUILDS_DIR/cmb-ci"
        TART_EXECUTOR_HOST_DIR: "false"
        # The default display size is too small for ParaView tests to show all
        # of the widgets necessary for the XML tests to be able to reach
        # widgets reliably.
        TART_EXECUTOR_DISPLAY: "1920x1204"

### Build and test

.macos_arm64:
    extends: .macos

    variables:
        CMAKE_CONFIGURATION: macos_arm64
        CTEST_NO_WARNINGS_ALLOWED: 1

## Tags

.macos_arm64_builder_tags:
    tags:
        - cmb
        - macos-arm64
        - tart

## macOS-specific scripts

.before_script_macos: &before_script_macos
    - .gitlab/ci/cmake.sh
    - .gitlab/ci/ninja.sh
    - export PATH=$PWD/.gitlab:$PWD/.gitlab/cmake/bin:$PATH
    - cmake --version
    - ninja --version
    # Download Qt
    - cmake -P .gitlab/ci/download_qt.cmake
    # Download the superbuild
    - cmake -P .gitlab/ci/download_superbuild.cmake
    - export CMAKE_PREFIX_PATH=$PWD/.gitlab/qt:$PWD/build/install
    - export SUPERBUILD_PREFIX=$PWD/build

.cmake_build_macos:
    stage: build

    script:
        - *before_script_macos
        - .gitlab/ci/sccache.sh
        # Allow the server to already be running.
        - "sccache --start-server || :"
        - sccache --show-stats
        - ctest -VV -S .gitlab/ci/ctest_configure.cmake
        - ctest -VV -S .gitlab/ci/ctest_build.cmake
        - sccache --show-stats

    interruptible: true

.cmake_test_macos:
    stage: test

    script:
        - *before_script_macos
        - ctest --output-on-failure -V -S .gitlab/ci/ctest_test.cmake
    interruptible: true
